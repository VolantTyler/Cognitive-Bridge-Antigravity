# Psychometric agent evaluation policy (Leo/team scope lock):
# - pull_request: cheap offline gate only (--validate-matrix + Vitest). Never full live Gemini eval.
# - workflow_dispatch: full live Antigravity/Gemini eval on demand (research/demo; not a merge gate).
# - schedule: optional weekly drift detection; bounded timeout; must not block merges or deploys.
# - Firebase/prod deploy workflows do NOT invoke this full eval path.
name: Psychometric Agent Evaluation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/constants.ts'
      - 'src/services/gemini.ts'
      - 'scripts/agent_eval.py'
      - 'requirements.txt'
      - '.github/workflows/agent-evaluation.yml'
  schedule:
    - cron: '0 0 * * 0' # Weekly drift check (informational; does not gate merges/deploys)
  workflow_dispatch: # On-demand deep pass before talks / after big prompt changes

jobs:
  validate-matrix:
    name: Validate steering matrix (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate steering matrix (offline)
        run: |
          source venv/bin/activate
          python scripts/agent_eval.py --validate-matrix

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Vitest
        run: npm ci && npm run test

  run-evaluation:
    name: Run Agent Testing & Alignment Verification
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Weekly drift runs are informational only; failures must not block merges or deploys.
    continue-on-error: ${{ github.event_name == 'schedule' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Agent Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          # Optional overrides for 503 capacity fallbacks:
          # GEMINI_EVAL_MODEL: gemini-3.8-flash
          # GEMINI_EVAL_FALLBACK_MODELS: gemini-2.5-flash,gemini-2.5-pro,gemini-1.5-flash
        run: |
          source venv/bin/activate
          python scripts/agent_eval.py

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-report
          path: agent_test_report.md
          retention-days: 30
